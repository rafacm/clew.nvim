# Tier 3: real projects, downloaded at pinned commits, indexed for real.
#
# Primarily on a schedule, because it needs a JDK, Maven, Node and minutes, and
# because it depends on the network -- GitHub, Maven Central, the npm registry --
# so a failure is not always about the commit under test. The trade is stated in
# doc/adr/0001-testing-strategy.md.
#
# The schedule is not merely a slower per-change run. It is the only thing that
# catches UPSTREAM drift: ScipTypeScriptPackage is pinned to @latest, so the
# producer moves underneath clew with no commit on clew's side, and a pinned
# project can be renamed or made private. No pull-request trigger can see that.
#
# The pull_request trigger below covers any change that could plausibly alter
# indexing, so a regression is found on the commit that caused it rather than a
# day later. Docs- and plugin-only changes are skipped.
#
# THIS JOB MUST NOT BECOME A REQUIRED CHECK. It depends on GitHub, Maven Central
# and the npm registry, and ScipTypeScriptPackage is pinned to @latest, so it can
# go red through no fault of the pull request. A required check that fails for
# reasons the author cannot fix teaches people to merge past red CI, at which
# point it protects nothing. Advisory is the whole design.
#
# THE PATHS LIST MIRRORS THE PROJECT LAYOUT AND DOES NOT MAINTAIN ITSELF. A new
# top-level Go package that is not listed here silently drops out of tier 3
# coverage -- the job does not fail, it simply never runs. See AGENTS.md.

name: acceptance

on:
  schedule:
    # 04:00 UTC daily, comfortably outside anyone's working hours.
    - cron: "0 4 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "internal/**" # every Go package that touches indexing, merge or query
      - "cmd/**"
      - "go.mod"
      - "go.sum"
      - "Makefile" # owns the test-acceptance target
      - ".github/workflows/acceptance.yml"

concurrency:
  # Keyed by ref so a pull-request run and the nightly do not serialise behind
  # one another; scheduled runs all share the `refs/heads/main` group.
  group: acceptance-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  acceptance:
    name: acceptance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      # Set explicitly so the cache step and the suite agree on one path across
      # both runners; cacheRoot reads XDG_CACHE_HOME before os.UserCacheDir.
      #
      # CAUTION: this also moves any OTHER tool that honours XDG. yarn classic
      # resolves its cache to $XDG_CACHE_HOME/yarn on Linux, so it landed inside
      # the workspace -- outside the cache path below, discarded every run, and
      # invisible except as an immer install that never got faster. The three
      # package managers are therefore pinned rather than left to their defaults,
      # which differ per platform anyway.
      XDG_CACHE_HOME: ${{ github.workspace }}/.cache
      YARN_CACHE_FOLDER: ${{ github.workspace }}/.cache/yarn
      BUN_INSTALL_CACHE_DIR: ${{ github.workspace }}/.cache/bun
      npm_config_cache: ${{ github.workspace }}/.cache/npm
      # Yarn berry ignores YARN_CACHE_FOLDER: since yarn 4 it caches under its
      # GLOBAL folder by default, which is a second path and a second variable.
      # COREPACK_HOME is where the berry release itself is downloaded --
      # SingleRepository_YarnPnP is the only test that needs one, and it pins the
      # version through the fixture's `packageManager` field.
      YARN_GLOBAL_FOLDER: ${{ github.workspace }}/.cache/yarn-berry
      COREPACK_HOME: ${{ github.workspace }}/.cache/corepack
      # Turn "toolchain missing, skipping" into a failure. Without this a broken
      # setup step yields a green job that verified nothing at all.
      CLEW_TEST_REQUIRE_TOOLS: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # NOTE: deliberately no `cache: maven`. That option keys its cache on
      # hashFiles('**/pom.xml') and fails the job outright when nothing matches
      # -- and clew has no pom.xml of its own. Every pom this suite touches
      # belongs to a fixture and does not exist until the download step runs.
      # ~/.m2 is cached explicitly below instead.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v7
        with:
          # Current LTS. The Angular fixture is the constraint here, and the
          # suite is what verifies the choice.
          node-version: "22"

      # clew installs a unit with the package manager the unit declares, so the
      # suite needs the ones its fixtures declare: immer ships a yarn.lock,
      # angular-realworld a bun.lock. Installed explicitly rather than trusted to
      # the runner image, and via npm rather than a third-party action, which
      # keeps the action list to actions/*. Both tests requireTools these, and
      # CLEW_TEST_REQUIRE_TOOLS makes a failure here loud instead of a skip.
      #
      # This is yarn CLASSIC, and deliberately so: immer's lockfile is a v1 one.
      # yarn 2+ is a different program, needed by SingleRepository_YarnPnP alone,
      # which reaches it through corepack rather than replacing the binary here.
      # corepack ships with the Node that setup-node just installed.
      - name: install the package managers the fixtures declare
        run: npm install --global yarn bun

      # Fixtures are keyed by commit SHA and never change under a given key, so
      # the cache is safe to restore and only grows when a pin moves.
      - name: cache downloaded fixtures
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.cache/clew-test
          key: clew-fixtures-${{ hashFiles('internal/acceptance/fixtures.go') }}
          restore-keys: clew-fixtures-

      # Resolving spring-petclinic, commons-lang and commons-text -- plus the
      # scip-javac and scip-java classpaths -- dominates a cold run. Keyed on
      # the fixture pins and on ScipVersion, which together decide everything
      # that gets resolved.
      - name: cache maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: clew-m2-${{ runner.os }}-${{ hashFiles('internal/acceptance/fixtures.go', 'internal/indexer/java.go') }}
          restore-keys: clew-m2-${{ runner.os }}-

      # Nothing cached on behalf of npm, yarn or bun, so every run re-downloaded
      # immer's dev-dependency graph from the registry -- 43s of a 115s suite,
      # and the slowest single test by a wide margin. The paths are the ones
      # pinned in `env:` above rather than each manager's per-platform default,
      # so what is cached and what is written cannot drift apart.
      # `npx @sourcegraph/scip-typescript@latest` lands in the npm cache and
      # benefits too. Keyed on the fixture pins, which decide which lockfiles get
      # installed, and on the OS, because these caches hold platform binaries.
      - name: cache javascript package manager downloads
        uses: actions/cache@v6
        with:
          path: |
            ${{ github.workspace }}/.cache/npm
            ${{ github.workspace }}/.cache/yarn
            ${{ github.workspace }}/.cache/bun
            ${{ github.workspace }}/.cache/yarn-berry
            ${{ github.workspace }}/.cache/corepack
          # v3 because the paths above changed while the key did not: a cache is
          # restored by key alone, so the old archive would have unpacked into the
          # directories it was saved from, the key would already exist, the save
          # would be skipped, and the entry would stay wrong forever. Bump this
          # whenever the path list changes.
          key: clew-js-v3-${{ runner.os }}-${{ hashFiles('internal/acceptance/fixtures.go') }}
          restore-keys: clew-js-v3-${{ runner.os }}-

      - name: acceptance
        run: make test-acceptance
